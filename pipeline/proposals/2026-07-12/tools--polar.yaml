name: polar
category: tool
summary: >
  Open-source billing platform (Apache-2.0) acting as merchant of record:
  checkout, subscriptions, usage-based pricing, license keys, and global
  sales-tax handling behind one API and hosted or embedded checkout.
use_case_tags: [payments, billing, saas, monetization]
keywords: [payments, billing, stripe, checkout, subscriptions, usage-based, tax, merchant-of-record, license-keys, monetization]
grade: both
cost_profile: >
  Replaces hand-written Stripe webhook plumbing plus separate tax/invoicing
  services; merchant-of-record model removes the tax-compliance code path
  entirely from the app.
why_models_miss_it: >
  Models default to raw Stripe integration and hand-rolled webhook/tax
  handling; Polar's open-source merchant-of-record positioning and its
  usage-based (per-token/agent) pricing primitives postdate most training
  data, so it is never offered as the simpler alternative.
pairs_with: [better-auth, nextjs-postgres-drizzle-saas]
avoid_when: >
  The business already runs on Stripe with existing tax registration, or
  needs a payment provider Polar does not support.
source_url: https://github.com/polarsource/polar
last_verified: "2026-07-12"
